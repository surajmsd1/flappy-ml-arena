<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Recording Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            padding: 20px 30px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1d1d1f;
        }
        h1 .icon {
            margin-right: 8px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            flex: 1;
            min-width: 140px;
        }
        .stat-card h3 {
            font-size: 12px;
            color: #86868b;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .toolbar select, .toolbar input {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #d2d2d7;
            background: #f5f5f7;
            color: #1d1d1f;
            font-size: 14px;
            font-family: inherit;
        }
        .toolbar select:focus, .toolbar input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.2);
        }
        .toolbar button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: #007aff;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: #0066d6;
        }
        .toolbar button.secondary {
            background: #e8e8ed;
            color: #1d1d1f;
        }
        .toolbar button.secondary:hover {
            background: #d2d2d7;
        }
        .toolbar button.danger {
            background: #ff3b30;
        }
        .toolbar button.danger:hover {
            background: #d63029;
        }
        .toolbar button:disabled {
            background: #c7c7cc;
            cursor: not-allowed;
        }
        .toolbar .spacer {
            flex: 1;
        }
        .toolbar .selection-info {
            color: #86868b;
            font-size: 14px;
            font-weight: 500;
        }

        /* Group Sections */
        .group-section {
            margin-bottom: 32px;
        }
        .group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            cursor: pointer;
            user-select: none;
        }
        .group-header:hover .group-title {
            color: #007aff;
        }
        .group-toggle {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #86868b;
            transition: transform 0.2s;
        }
        .group-header.collapsed .group-toggle {
            transform: rotate(-90deg);
        }
        .group-title {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
            transition: color 0.2s;
        }
        .group-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        .group-badge.genetic { background: #34c759; }
        .group-badge.neat { background: #af52de; }
        .group-badge.imitation { background: #ff9500; }
        .group-badge.dqn { background: #ff2d55; }
        .group-badge.human { background: #5ac8fa; }
        .group-badge.unknown { background: #8e8e93; }
        .group-count {
            font-size: 14px;
            color: #86868b;
        }
        .group-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .group-actions button {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: #e8e8ed;
            color: #1d1d1f;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .group-actions button:hover {
            background: #d2d2d7;
        }
        .group-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            transition: all 0.3s;
        }
        .group-header.collapsed + .group-content {
            display: none;
        }

        /* Recording Cards */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .card.selected {
            border: 2px solid #007aff;
            box-shadow: 0 4px 16px rgba(0,122,255,0.25);
        }
        .card-checkbox {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 22px;
            height: 22px;
            background: white;
            border: 2px solid #d2d2d7;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s;
        }
        .card:hover .card-checkbox {
            border-color: #007aff;
        }
        .card.selected .card-checkbox {
            background: #007aff;
            border-color: #007aff;
        }
        .card.selected .card-checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        .card-preview {
            width: 100%;
            height: 140px;
            background: linear-gradient(180deg, #87ceeb 0%, #a8d8ea 100%);
            position: relative;
            overflow: hidden;
        }
        .card-preview .preview-bird {
            position: absolute;
            width: 30px;
            height: 22px;
            background: #ffcc00;
            border-radius: 50%;
            top: 50%;
            left: 30%;
            transform: translateY(-50%);
            box-shadow: inset -3px -2px 0 #e0a800;
        }
        .card-preview .preview-pipe {
            position: absolute;
            width: 40px;
            background: #49993c;
            right: 20%;
        }
        .card-preview .preview-pipe.top {
            top: 0;
            height: 45px;
            border-bottom: 8px solid #3d8032;
        }
        .card-preview .preview-pipe.bottom {
            bottom: 0;
            height: 50px;
            border-top: 8px solid #3d8032;
        }
        .card-preview .preview-ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: #7cb518;
        }
        .card-body {
            padding: 14px;
        }
        .card-model-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
            margin-bottom: 8px;
        }
        .card-model-badge.genetic { background: #34c759; }
        .card-model-badge.neat { background: #af52de; }
        .card-model-badge.imitation { background: #ff9500; }
        .card-model-badge.dqn { background: #ff2d55; }
        .card-model-badge.human { background: #5ac8fa; }
        .card-model-badge.unknown { background: #8e8e93; }
        .card-score {
            font-size: 32px;
            font-weight: 700;
            color: #1d1d1f;
            line-height: 1;
            margin-bottom: 8px;
        }
        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: #86868b;
        }
        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-filename {
            font-size: 11px;
            color: #86868b;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
        }
        .empty-state h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            background: #1d1d1f;
            color: white;
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.error {
            background: #ff3b30;
        }
        .toast.success {
            background: #34c759;
        }

        /* Analytics Section */
        .analytics {
            margin-top: 32px;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .analytics h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1d1d1f;
        }
        .model-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .model-stat {
            background: #f5f5f7;
            padding: 16px;
            border-radius: 10px;
        }
        .model-stat h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .model-stat .detail {
            font-size: 13px;
            color: #86868b;
            margin: 4px 0;
        }
        .model-stat .detail strong {
            color: #1d1d1f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="icon">🐦</span>Recording Manager</h1>

        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <h3>Recordings</h3>
                <div class="value" id="totalRecordings">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Frames</h3>
                <div class="value" id="totalFrames">-</div>
            </div>
            <div class="stat-card">
                <h3>Storage</h3>
                <div class="value" id="totalSize">-</div>
            </div>
        </div>

        <div class="toolbar">
            <select id="modelFilter">
                <option value="all">All Models</option>
                <option value="genetic">Genetic</option>
                <option value="neat">NEAT</option>
                <option value="imitation">Imitation</option>
                <option value="dqn">DQN</option>
                <option value="human">Human</option>
            </select>
            <select id="sortBy">
                <option value="mtime">Sort by Date</option>
                <option value="score">Sort by Score</option>
                <option value="generation">Sort by Generation</option>
                <option value="frames">Sort by Frames</option>
            </select>
            <input type="number" id="minScore" placeholder="Min Score" style="width: 100px;">
            <input type="number" id="maxScore" placeholder="Max Score" style="width: 100px;">
            <button class="secondary" onclick="applyFilters()">Filter</button>
            <button class="secondary" onclick="resetFilters()">Reset</button>
            <span class="spacer"></span>
            <span class="selection-info"><strong id="selectedCount">0</strong> selected</span>
            <select id="gridSize">
                <option value="2">2×2 Grid</option>
                <option value="3">3×3 Grid</option>
                <option value="4">4×4 Grid</option>
            </select>
            <button id="playBtn" onclick="playSelected()" disabled>▶ Play</button>
            <button id="deleteBtn" class="danger" onclick="deleteSelected()" disabled>Delete</button>
        </div>

        <div id="recordingsContainer">
            <div class="empty-state">
                <h3>Loading recordings...</h3>
            </div>
        </div>

        <div class="analytics" id="analytics">
            <h2>📊 Model Analytics</h2>
            <div class="model-stats" id="modelStats"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let recordings = [];
        let selectedFiles = new Set();
        let collapsedGroups = new Set();

        async function loadRecordings() {
            const params = new URLSearchParams();

            const modelFilter = document.getElementById('modelFilter').value;
            if (modelFilter !== 'all') params.set('model_type', modelFilter);

            const sortBy = document.getElementById('sortBy').value;
            params.set('sort', sortBy);
            params.set('order', 'desc');

            const minScore = document.getElementById('minScore').value;
            if (minScore) params.set('min_score', minScore);

            const maxScore = document.getElementById('maxScore').value;
            if (maxScore) params.set('max_score', maxScore);

            try {
                const response = await fetch('/api/recordings?' + params.toString());
                recordings = await response.json();
                renderRecordings();
            } catch (err) {
                showToast('Error loading recordings', 'error');
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                document.getElementById('totalRecordings').textContent = stats.total_recordings;
                document.getElementById('totalFrames').textContent = stats.total_frames.toLocaleString();
                document.getElementById('totalSize').textContent = stats.total_size_mb + ' MB';

                // Render model stats
                const modelStatsDiv = document.getElementById('modelStats');
                modelStatsDiv.innerHTML = '';

                for (const [model, data] of Object.entries(stats.by_model)) {
                    const div = document.createElement('div');
                    div.className = 'model-stat';
                    div.innerHTML = `
                        <h4><span class="card-model-badge ${model}">${model}</span></h4>
                        <div class="detail"><strong>${data.count}</strong> recordings</div>
                        <div class="detail">Avg: <strong>${data.avg_score}</strong></div>
                        <div class="detail">Best: <strong>${data.max_score}</strong></div>
                    `;
                    modelStatsDiv.appendChild(div);
                }
            } catch (err) {
                console.error('Error loading stats:', err);
            }
        }

        function groupRecordings(recordings) {
            const groups = {};

            for (const r of recordings) {
                // Group key: model_type + generation (or "ungrouped")
                let groupKey;
                let groupLabel;
                let sortOrder;

                if (r.model_type === 'human') {
                    groupKey = 'human';
                    groupLabel = 'Human Gameplay';
                    sortOrder = 9999; // Put at end
                } else if (r.generation !== null) {
                    groupKey = `${r.model_type}_gen${r.generation}`;
                    groupLabel = `${r.model_type.charAt(0).toUpperCase() + r.model_type.slice(1)} Gen ${r.generation}`;
                    sortOrder = r.generation;
                } else {
                    groupKey = r.model_type;
                    groupLabel = r.model_type.charAt(0).toUpperCase() + r.model_type.slice(1);
                    sortOrder = 0;
                }

                if (!groups[groupKey]) {
                    groups[groupKey] = {
                        key: groupKey,
                        label: groupLabel,
                        model: r.model_type,
                        sortOrder: sortOrder,
                        recordings: []
                    };
                }
                groups[groupKey].recordings.push(r);
            }

            // Sort groups by model type, then by generation
            return Object.values(groups).sort((a, b) => {
                if (a.model !== b.model) {
                    const order = ['genetic', 'neat', 'imitation', 'dqn', 'human', 'unknown'];
                    return order.indexOf(a.model) - order.indexOf(b.model);
                }
                return a.sortOrder - b.sortOrder;
            });
        }

        function renderRecordings() {
            const container = document.getElementById('recordingsContainer');

            if (recordings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No recordings found</h3>
                        <p>Play some games or run training to create recordings.</p>
                    </div>
                `;
                return;
            }

            const groups = groupRecordings(recordings);
            let html = '';

            for (const group of groups) {
                const isCollapsed = collapsedGroups.has(group.key);
                const groupSelectedCount = group.recordings.filter(r => selectedFiles.has(r.filename)).length;

                html += `
                    <div class="group-section" data-group="${group.key}">
                        <div class="group-header ${isCollapsed ? 'collapsed' : ''}" onclick="toggleGroup('${group.key}')">
                            <span class="group-toggle">▼</span>
                            <span class="group-title">${group.label}</span>
                            <span class="group-badge ${group.model}">${group.model}</span>
                            <span class="group-count">${group.recordings.length} recordings</span>
                            <div class="group-actions" onclick="event.stopPropagation()">
                                <button onclick="selectGroup('${group.key}')">Select All</button>
                                <button onclick="playGroup('${group.key}')">▶ Play All</button>
                            </div>
                        </div>
                        <div class="group-content">
                            ${group.recordings.map(r => renderCard(r)).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            updateSelectionUI();
        }

        function renderCard(r) {
            const isSelected = selectedFiles.has(r.filename);
            return `
                <div class="card ${isSelected ? 'selected' : ''}"
                     data-filename="${r.filename}"
                     onclick="toggleCard('${r.filename}', event)">
                    <div class="card-checkbox"></div>
                    <div class="card-preview">
                        <div class="preview-bird"></div>
                        <div class="preview-pipe top"></div>
                        <div class="preview-pipe bottom"></div>
                        <div class="preview-ground"></div>
                    </div>
                    <div class="card-body">
                        <span class="card-model-badge ${r.model_type}">${r.model_type}</span>
                        <div class="card-score">${r.score}</div>
                        <div class="card-meta">
                            ${r.generation !== null ? `<span>Gen ${r.generation}</span>` : ''}
                            <span>${r.frames.toLocaleString()} frames</span>
                            <span>${r.duration_sec}s</span>
                            <span>${formatSize(r.file_size)}</span>
                        </div>
                        <div class="card-filename" title="${r.filename}">${r.filename}</div>
                    </div>
                </div>
            `;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        function toggleCard(filename, event) {
            // Ignore clicks on group actions
            if (event.target.closest('.group-actions')) return;

            if (event.shiftKey && lastSelectedFile) {
                // Shift+click: range selection
                rangeSelect(lastSelectedFile, filename);
            } else {
                if (selectedFiles.has(filename)) {
                    selectedFiles.delete(filename);
                } else {
                    selectedFiles.add(filename);
                }
                lastSelectedFile = filename;
            }
            updateCardUI();
            updateSelectionUI();
        }

        let lastSelectedFile = null;

        function rangeSelect(from, to) {
            const allFiles = recordings.map(r => r.filename);
            const fromIdx = allFiles.indexOf(from);
            const toIdx = allFiles.indexOf(to);
            const start = Math.min(fromIdx, toIdx);
            const end = Math.max(fromIdx, toIdx);

            for (let i = start; i <= end; i++) {
                selectedFiles.add(allFiles[i]);
            }
        }

        function updateCardUI() {
            document.querySelectorAll('.card').forEach(card => {
                const filename = card.dataset.filename;
                if (selectedFiles.has(filename)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
        }

        function toggleGroup(groupKey) {
            if (collapsedGroups.has(groupKey)) {
                collapsedGroups.delete(groupKey);
            } else {
                collapsedGroups.add(groupKey);
            }
            renderRecordings();
        }

        function selectGroup(groupKey) {
            const groups = groupRecordings(recordings);
            const group = groups.find(g => g.key === groupKey);
            if (group) {
                const allSelected = group.recordings.every(r => selectedFiles.has(r.filename));
                if (allSelected) {
                    // Deselect all
                    group.recordings.forEach(r => selectedFiles.delete(r.filename));
                } else {
                    // Select all
                    group.recordings.forEach(r => selectedFiles.add(r.filename));
                }
                updateCardUI();
                updateSelectionUI();
            }
        }

        function playGroup(groupKey) {
            const groups = groupRecordings(recordings);
            const group = groups.find(g => g.key === groupKey);
            if (group) {
                const filenames = group.recordings.map(r => r.filename);
                playFiles(filenames);
            }
        }

        function updateSelectionUI() {
            const count = selectedFiles.size;
            document.getElementById('selectedCount').textContent = count;
            document.getElementById('playBtn').disabled = count === 0;
            document.getElementById('deleteBtn').disabled = count === 0;
        }

        async function playSelected() {
            if (selectedFiles.size === 0) return;
            playFiles(Array.from(selectedFiles));
        }

        async function playFiles(filenames) {
            const gridSize = parseInt(document.getElementById('gridSize').value);

            try {
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        filenames: filenames,
                        grid: gridSize
                    })
                });

                const result = await response.json();
                if (result.success) {
                    showToast(`Playing ${result.playing} recordings`, 'success');
                } else {
                    showToast(result.error, 'error');
                }
            } catch (err) {
                showToast('Error launching player', 'error');
            }
        }

        async function deleteSelected() {
            if (selectedFiles.size === 0) return;

            if (!confirm(`Delete ${selectedFiles.size} recording(s)? This cannot be undone.`)) return;

            let deleted = 0;
            let errors = 0;

            for (const filename of selectedFiles) {
                try {
                    const response = await fetch('/api/delete', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({filename})
                    });

                    const result = await response.json();
                    if (result.success) {
                        deleted++;
                    } else {
                        errors++;
                    }
                } catch (err) {
                    errors++;
                }
            }

            selectedFiles.clear();
            loadRecordings();
            loadStats();

            if (errors > 0) {
                showToast(`Deleted ${deleted}, ${errors} failed`, 'error');
            } else {
                showToast(`Deleted ${deleted} recording(s)`, 'success');
            }
        }

        function applyFilters() {
            loadRecordings();
        }

        function resetFilters() {
            document.getElementById('modelFilter').value = 'all';
            document.getElementById('sortBy').value = 'mtime';
            document.getElementById('minScore').value = '';
            document.getElementById('maxScore').value = '';
            loadRecordings();
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;

            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Initial load
        loadRecordings();
        loadStats();
    </script>
</body>
</html>
